<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CWT - Export WhatsApp Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      width: 350px;
      padding: 20px;
      background: linear-gradient(135deg, #00a884 0%, #128c7e 100%);
      color: #333;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #075e54;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      font-size: 12px;
      color: #667781;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #075e54;
    }

    .format-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .format-btn {
      flex: 1;
      padding: 12px;
      background: #f0f2f5;
      border: 2px solid #e9edef;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .format-btn:hover {
      background: #e9edef;
      border-color: #00a884;
    }

    .format-btn.selected {
      background: #00a884;
      color: white;
      border-color: #00a884;
    }

    .export-btn {
      width: 100%;
      padding: 14px;
      background: #00a884;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .export-btn:hover {
      background: #128c7e;
    }

    .export-btn:disabled {
      background: #b3b3b3;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .privacy-note {
      margin-top: 20px;
      padding: 10px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 6px;
      font-size: 11px;
      color: #856404;
    }

    .privacy-note strong {
      display: block;
      margin-bottom: 5px;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 10px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #00a884;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>💬</span>
      CWT
    </h1>
    <div class="subtitle">Export your WhatsApp chat with full media</div>

    <div class="section">
      <div class="section-title">Select Export Format:</div>
      <div class="format-options">
        <button class="format-btn selected" data-format="html">
          📄 HTML
        </button>
        <button class="format-btn" data-format="txt">
          📝 TXT
        </button>
        <button class="format-btn" data-format="json">
          💾 JSON
        </button>
      </div>
    </div>

    <button class="export-btn" id="exportBtn">
      Export Current Chat
    </button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div style="margin-top: 10px; font-size: 13px; color: #667781;">
        Extracting messages...
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="privacy-note">
      <strong>🔒 Privacy First</strong>
      All processing happens locally in your browser. No data is sent to any server.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
